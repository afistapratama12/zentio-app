[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "none"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  framework = "#custom"