[build]
  command = "npm run build"
  publish = ".netlify/deploy"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  framework = "#custom"